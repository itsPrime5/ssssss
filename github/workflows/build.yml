name: Build Minecraft mod
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build mod
        run: gradle build
      - name: Save the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: undertide-mod
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
